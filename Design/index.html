<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Murmur</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── Search result cards ── */
    .search-user-card {
      padding: 9px 10px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 9px;
      transition: background 0.12s;
    }
    .search-user-card:hover { background: rgba(0,0,0,0.03); }
    .search-user-info { flex: 1; min-width: 0; }

    .search-action-btn {
      flex-shrink: 0;
      padding: 5px 10px;
      border-radius: 7px;
      font-size: 11px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-new-chat {
      background: var(--sand);
      color: #fff;
      border-color: var(--sand);
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-new-chat:hover { background: var(--sand-hover); border-color: var(--sand-hover); }

    .btn-add-friend {
      background: transparent;
      color: var(--sand-dark);
      border-color: var(--sand);
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      line-height: 1;
    }
    .btn-add-friend:hover { background: var(--sand); color: #fff; border-color: var(--sand); }
    .btn-add-friend:disabled {
      opacity: 0.55;
      cursor: default;
      pointer-events: none;
      font-size: 11px;
      width: auto;
      padding: 0 7px;
    }

    /* ── Friend-accepted notification card ── */
    .accepted-card {
      background: #f4faf5;
      border: 0.5px solid #a8d5ad;
      border-radius: 12px;
      padding: 11px 12px;
      animation: slideIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .accepted-top {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 10px;
    }

    .accepted-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #c5e8c9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 500;
      color: #2e6e38;
      flex-shrink: 0;
    }

    .accepted-label {
      font-size: 10px;
      color: #3a8a47;
      font-weight: 500;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .accepted-name { font-size: 13px; font-weight: 500; color: var(--warm-dark); }
    .accepted-uid  { font-size: 10px; color: var(--text-muted); margin-top: 1px; }

    .btn-start-convo {
      width: 100%;
      padding: 7px 0;
      border-radius: 7px;
      font-size: 11px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      cursor: pointer;
      background: var(--sand);
      color: #fff;
      border: 1.5px solid var(--sand);
      transition: background 0.15s, border-color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      letter-spacing: 0.2px;
    }
    .btn-start-convo:hover { background: var(--sand-hover); border-color: var(--sand-hover); }

    /* ── Empty chat state ── */
    .chat-empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 13px;
      text-align: center;
      padding: 20px;
    }
    .chat-empty-state .ename {
      font-family: 'Lora', serif;
      font-size: 16px;
      color: var(--warm-dark);
      margin-top: 4px;
    }
    .chat-empty-state .esub {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ── Back button (mobile only) ── */
    .back-btn {
      display: none;
      width: 32px;
      height: 32px;
      border-radius: 9px;
      border: none;
      background: var(--beige-200);
      cursor: pointer;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      flex-shrink: 0;
      margin-right: 2px;
      transition: background 0.15s;
    }
    .back-btn:hover { background: var(--beige-300); }

    /* ══════════════════════════════════════════════
       MOBILE LAYOUT  ≤ 600px
    ══════════════════════════════════════════════ */
    @media (max-width: 600px) {
      html, body {
        background: var(--beige-100);
        align-items: stretch;
        justify-content: stretch;
      }

      .app {
        width: 100%;
        height: 100dvh;
        border-radius: 0;
        border: none;
        box-shadow: none;
        flex-direction: column;
        position: relative;
        overflow: hidden;
      }

      /* ── Nav rail → bottom tab bar ── */
      .nav-rail {
        width: 100%;
        height: 56px;
        flex-direction: row;
        border-right: none;
        border-top: 0.5px solid var(--beige-300);
        padding: 0 12px;
        gap: 0;
        order: 3;
        background: var(--beige-50);
        justify-content: space-around;
        flex-shrink: 0;
      }

      .nav-spacer { display: none; }

      .nav-btn, .logout-btn {
        width: 44px;
        height: 44px;
        border-radius: 12px;
      }

      /* ── Sidebar fills full width, sits in the middle ── */
      .sidebar {
        width: 100%;
        flex: 1;
        order: 1;
        border-right: none;
        /* slide-in/out on mobile */
        position: absolute;
        top: 0; left: 0; right: 0;
        bottom: 56px; /* above bottom tab bar */
        transform: translateX(0);
        transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
        z-index: 2;
      }

      .sidebar.collapsed {
        transform: translateX(-100%);
        pointer-events: none;
      }

      /* ── Chat area fills full width behind sidebar ── */
      .chat-area {
        position: absolute;
        top: 0; left: 0; right: 0;
        bottom: 56px;
        order: 2;
        transform: translateX(100%);
        transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
        z-index: 1;
      }

      .chat-area.active {
        transform: translateX(0);
      }

      /* Show back button on mobile */
      .back-btn { display: inline-flex; }

      /* Panels take full height */
      .panel { height: 100%; }

      /* User bar at bottom of panel stays visible */
      .user-bar { flex-shrink: 0; }
    }
  </style>
</head>
<body>

<div class="app">

  <!-- ── NAV RAIL ── -->
  <div class="nav-rail">
    <button class="nav-btn active" id="nb-chat" onclick="switchPanel('chat')" title="Chats">

      <div class="user-bar">

          <div class="uname">hogRider</div>
          <div class="uid">#751IUP</div>
        </div>
      </div>
    </div>

    <!-- SEARCH PANEL -->
    <div class="panel" id="panel-search">
      <div class="panel-head">Find user</div>
      <div class="divider"></div>
      <div class="search-box">
        <svg width="13" height="13" fill="none" stroke="var(--text-muted)" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input id="search-input" type="text" placeholder="UID or Username" oninput="doSearch(this.value)" />
      </div>
      <div class="search-results" id="search-results">
        <div class="search-hint">Type a username or UID to find someone</div>
      </div>
      <div class="user-bar">
        <div class="user-bar-avatar">HR</div>
        <div>
          <div class="uname">hogRider</div>
          <div class="uid">#751IUP</div>
        </div>
      </div>
    </div>

  </div><!-- end .sidebar -->

  <!-- ── CHAT AREA ── -->
  <div class="chat-area">

    <div class="chat-header">
      <button class="back-btn" onclick="goBackToSidebar()" title="Back">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <div class="chat-header-avatar" id="chat-avatar">GR</div>
      <div>
        <div class="hname" id="chat-hname">ghostRider</div>
        <div class="hstatus" id="chat-hstatus">online</div>

    </div>

    <div class="messages" id="msgs" onclick="closeAll(event)">
      <!-- rendered by JS -->
    </div>

    <div class="compose">
      <button class="attach-btn" title="Attach file">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
        </svg>

      <input class="compose-input" id="compose-input" type="text" placeholder="Type a message…" onkeydown="if(event.key==='Enter')sendMessage()" />
      <button class="send-btn" title="Send" onclick="sendMessage()">

          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>

  </div><!-- end .chat-area -->

</div><!-- end .app -->

/* ══════════════════════════════════════════════════
   PANEL SWITCHING
══════════════════════════════════════════════════ */
function switchPanel(name) {
  ['chat', 'pending', 'search'].forEach(p => {
    document.getElementById('panel-' + p).classList.toggle('active', p === name);
    document.getElementById('nb-' + p).classList.toggle('active', p === name);
  });
}

/* ══════════════════════════════════════════════════
   CONTACT LIST
══════════════════════════════════════════════════ */
function renderContactList() {
  var list = document.getElementById('contact-list');
  if (!conversations.length) {
    list.innerHTML = '<div class="search-hint" style="padding:16px 10px;">No conversations yet</div>';
    return;
  }
  list.innerHTML = conversations.map(function(c) {
    return '<div class="contact ' + (c.name === activeChat ? 'active' : '') + '" onclick="openChat(\'' + c.name + '\',\'' + c.uid + '\',\'' + c.initials + '\')">'
      + '<div class="avatar ' + (c.gray ? 'gray' : '') + '">' + c.initials + '</div>'
      + '<div>'
      + '<div class="contact-name">' + c.name + '</div>'
      + '<div class="contact-preview">' + c.preview + '</div>'
      + '</div></div>';
  }).join('');
}

/* ══════════════════════════════════════════════════
   OPEN CHAT
══════════════════════════════════════════════════ */
function openChat(name, uid, initials) {
  activeChat = name;

  document.getElementById('chat-avatar').textContent  = initials;
  document.getElementById('chat-hname').textContent   = name;
  document.getElementById('chat-hstatus').textContent = 'online';

  renderContactList();

  var msgs = document.getElementById('msgs');
  if (chatMessages[name]) {
    msgs.innerHTML = chatMessages[name];
    msgs.scrollTop = 9999;
  } else {
    msgs.innerHTML =
      '<div class="chat-empty-state">'
      + '<svg width="38" height="38" fill="none" stroke="var(--beige-300)" stroke-width="1.5" viewBox="0 0 24 24">'
      + '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>'
      + '</svg>'
      + '<div class="ename">' + name + '</div>'
      + '<div class="esub">No messages yet — say hello!</div>'
      + '</div>';
  }
}

/* ══════════════════════════════════════════════════
   SEND MESSAGE
══════════════════════════════════════════════════ */
function sendMessage() {
  var input = document.getElementById('compose-input');
  var text  = input.value.trim();
  if (!text) return;

  var msgs = document.getElementById('msgs');

  // Clear empty state if present
  var empty = msgs.querySelector('.chat-empty-state');
  if (empty) empty.remove();

  var now = new Date();
  var t   = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  var id  = 'msg_' + Date.now();
  var escaped = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  var row = document.createElement('div');
  row.className = 'msg-row out';
  row.innerHTML =
    '<div class="msg-wrap out"><div class="msg-rel out">'
    + '<div style="display:flex;align-items:center;gap:5px;justify-content:flex-end;">'
    + '<button class="dot-menu-btn" onclick="toggleMenu(event,\'' + id + '\')">'
    + '<svg width="12" height="12" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>'
    + '</button>'
    + '<div class="bubble out">' + escaped + '</div>'
    + '</div>'
    + '<div class="dropdown" id="' + id + '" style="right:0;top:30px;">'
    + '<div class="dd-item" onclick="closeAll({target:document.body})">Edit</div>'
    + '<div class="dd-item danger" onclick="deleteMsg(this)">Delete</div>'
    + '</div>'
    + '<div class="ts r">' + t + '</div>'
    + '</div></div>';

  msgs.appendChild(row);
  msgs.scrollTop = 9999;

  // Update preview
  var convo = conversations.find(function(c) { return c.name === activeChat; });
  if (convo) { convo.preview = text; renderContactList(); }

  input.value = '';
}

function deleteMsg(btn) {
  var row    = btn.closest('.msg-row');
  var bubble = row.querySelector('.bubble.out');
  if (bubble) {
    bubble.outerHTML =
      '<div class="bubble-deleted">'
      + '<svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">'
      + '<circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>'
      + '</svg>this message was deleted</div>';
  }
  closeAll({ target: document.body });
}

/* ══════════════════════════════════════════════════
   SEARCH — shows "New Chat" for friends, "Add Friend" otherwise
══════════════════════════════════════════════════ */
function doSearch(val) {
  var r = document.getElementById('search-results');
  if (!val.trim()) {
    r.innerHTML = '<div class="search-hint">Type a username or UID to find someone</div>';
    return;
  }
  var v    = val.toLowerCase();
  var hits = mockUsers.filter(function(u) {
    return u.name !== ME.name
      && (u.name.toLowerCase().includes(v) || u.uid.toLowerCase().includes(v));
  });
  if (!hits.length) {
    r.innerHTML = '<div class="search-hint">No users found</div>';
    return;
  }
  r.innerHTML = hits.map(function(u) {
    var initials = u.name.slice(0, 2).toUpperCase();
    var isFriend = friends.has(u.name);
    var isPending = pendingOutgoing.has(u.name);
    var btn;
    if (isFriend) {
      btn = '<button class="search-action-btn btn-new-chat" title="Start chat" onclick="startNewChat(\'' + u.name + '\',\'' + u.uid + '\',\'' + initials + '\')">'
          + '<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'
          + '</button>';
    } else if (isPending) {
      btn = '<button class="search-action-btn btn-add-friend" title="Requested" disabled><svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></button>';
    } else {
      btn = '<button class="search-action-btn btn-add-friend" title="Add Friend" onclick="sendFriendReq(\'' + u.name + '\',this)"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>';
    }
    return '<div class="search-user-card">'
      + '<div class="avatar" style="font-size:10px;">' + initials + '</div>'
      + '<div class="search-user-info">'
      + '<div class="contact-name">' + u.name + '</div>'
      + '<div class="contact-preview">' + u.uid + '</div>'
      + '</div>' + btn + '</div>';
  }).join('');
}

function sendFriendReq(name, btn) {
  pendingOutgoing.add(name);
  btn.innerHTML = '<svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
  btn.disabled         = true;
}

/* ── Start a new chat from the search panel ── */
function startNewChat(name, uid, initials) {
  // Add to conversations list if not already there
  if (!conversations.find(function(c) { return c.name === name; })) {
    conversations.unshift({ name: name, uid: uid, initials: initials, preview: 'New conversation', gray: true });
  }
  // Switch to Chats panel and open conversation
  switchPanel('chat');
  openChat(name, uid, initials);
}

/* ══════════════════════════════════════════════════
   CONTEXT MENU
══════════════════════════════════════════════════ */
function toggleMenu(e, id) {
  e.stopPropagation();
  document.querySelectorAll('.dropdown').forEach(function(d) {
    if (d.id !== id) d.classList.remove('open');
  });
  document.getElementById(id).classList.toggle('open');
}

function closeAll(e) {
  if (!e.target.closest || (!e.target.closest('.dot-menu-btn') && !e.target.closest('.dropdown'))) {
    document.querySelectorAll('.dropdown').forEach(function(d) { d.classList.remove('open'); });
  }
}

/* ══════════════════════════════════════════════════
   PENDING HELPERS
══════════════════════════════════════════════════ */
function checkPendingEmpty() {
  var list  = document.getElementById('pending-list');
  var empty = document.getElementById('pending-empty');
  if (!list.children.length) {
    list.style.display  = 'none';
    empty.style.display = 'flex';
  }
}

function pulseBadge() {
  var badge = document.querySelector('.badge');
  badge.classList.add('pulse');
  badge.addEventListener('animationend', function() { badge.classList.remove('pulse'); }, { once: true });
}

function showPendingList() {
  var list  = document.getElementById('pending-list');
  var empty = document.getElementById('pending-empty');
  empty.style.display = 'none';
  list.style.display  = 'flex';
  return list;
}

/* ══════════════════════════════════════════════════
   INCOMING FRIEND REQUEST — nightOwl (after 1.7s)
══════════════════════════════════════════════════ */
setTimeout(function() {
  var list = showPendingList();
  pulseBadge();

  var card = document.createElement('div');
  card.className = 'request-card';
  card.id = 'req-nightOwl';
  card.innerHTML =
    '<div class="request-top">'
    + '<div class="request-avatar">NO</div>'
    + '<div>'
    + '<div class="request-name">nightOwl</div>'
    + '<div class="request-uid">#NIT44 &nbsp;&middot;&nbsp; just now</div>'
    + '</div></div>'
    + '<div class="request-actions">'
    + '<button class="req-btn req-accept"  onclick="handleIncomingReq(\'nightOwl\',\'#NIT44\',\'NO\',\'accept\')">Accept</button>'
    + '<button class="req-btn req-decline" onclick="handleIncomingReq(\'nightOwl\',\'#NIT44\',\'NO\',\'decline\')">Decline</button>'
    + '</div>';
  list.appendChild(card);
}, 1700);

function handleIncomingReq(name, uid, initials, action) {
  if (action === 'accept') {
    friends.add(name);
    // Add to conversations if not already there
    if (!conversations.find(function(c) { return c.name === name; })) {
      conversations.push({ name: name, uid: uid, initials: initials, preview: 'New friend', gray: true });
      renderContactList();
    }
  }
  var card = document.getElementById('req-' + name);
  card.style.transition = 'opacity 0.3s, transform 0.3s';
  card.style.opacity    = '0';
  card.style.transform  = 'translateY(-8px)';
  setTimeout(function() { card.remove(); checkPendingEmpty(); }, 300);
}

/* ══════════════════════════════════════════════════
   OUTGOING REQUEST ACCEPTED — pixelDust accepts (after 3.5s)
   Shows "Friend has accepted your request" notification
   with a "Start Conversation" button
══════════════════════════════════════════════════ */
setTimeout(function() {
  friends.add('pixelDust');
  var list = showPendingList();
  pulseBadge();

  var card = document.createElement('div');
  card.className = 'accepted-card';
  card.id = 'acc-pixelDust';
  card.innerHTML =
    '<div class="accepted-top">'
    + '<div class="accepted-avatar">PD</div>'
    + '<div>'
    + '<div class="accepted-label">'
    + '<svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'
    + 'Friend request accepted'
    + '</div>'
    + '<div class="accepted-name">pixelDust</div>'
    + '<div class="accepted-uid">#PXD77 &nbsp;&middot;&nbsp; just now</div>'
    + '</div></div>'
    + '<button class="btn-start-convo" onclick="acceptedStartChat(\'pixelDust\',\'#PXD77\',\'PD\',\'acc-pixelDust\')">'
    + '<svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">'
    + '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>'
    + '</svg>'
    + 'Start Conversation'
    + '</button>';
  list.appendChild(card);
}, 3500);

/* Dismiss accepted card then open chat */
function acceptedStartChat(name, uid, initials, cardId) {
  var card = document.getElementById(cardId);
  card.style.transition = 'opacity 0.3s, transform 0.3s';
  card.style.opacity    = '0';
  card.style.transform  = 'translateY(-8px)';
  setTimeout(function() {
    card.remove();
    checkPendingEmpty();
    startNewChat(name, uid, initials);
  }, 280);
}

/* ══════════════════════════════════════════════════
   MOBILE NAV
══════════════════════════════════════════════════ */
function isMobile() { return window.innerWidth <= 600; }

function showChat() {
  if (!isMobile()) return;
  document.querySelector('.sidebar').classList.add('collapsed');
  document.querySelector('.chat-area').classList.add('active');
}

function goBackToSidebar() {
  document.querySelector('.sidebar').classList.remove('collapsed');
  document.querySelector('.chat-area').classList.remove('active');
}

/* Patch openChat to slide to chat on mobile */
var _origOpenChat = openChat;
openChat = function(name, uid, initials) {
  _origOpenChat(name, uid, initials);
  showChat();
};

/* Patch switchPanel to always show sidebar on mobile */
var _origSwitchPanel = switchPanel;
switchPanel = function(name) {
  _origSwitchPanel(name);
  if (isMobile()) {
    document.querySelector('.sidebar').classList.remove('collapsed');
    document.querySelector('.chat-area').classList.remove('active');
  }
};

/* ══════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════ */
renderContactList();
openChat('ghostRider', '#GHR92', 'GR');
</script>
